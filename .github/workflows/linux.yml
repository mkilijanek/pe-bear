# Build and test PE-bear on Linux.
#
# The project is CMake-based with three git submodules (capstone, bearparser,
# sig_finder) that the build cannot proceed without, and it needs Qt5 or Qt6
# development packages. Neither is available by default on a runner, which is
# why both are set up explicitly below.
name: Linux

on:
  push:
    branches: [ "main" ]
  pull_request:

# Read-only token: nothing here publishes or writes to the repository.
permissions:
  contents: read

# A new push to the same ref makes the previous run pointless.
concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.qt }} / ${{ matrix.cc }}
    runs-on: ubuntu-24.04

    strategy:
      # One broken combination should not hide the state of the others.
      fail-fast: false
      matrix:
        include:
          # Qt5 is what the published Linux packages are built against.
          - { qt: Qt5, cc: gcc,   cxx: g++,     qt_pkg: qtbase5-dev,  qt_flag: -DUSE_QT5=ON }
          # A second compiler catches the warnings and conformance issues GCC lets through.
          - { qt: Qt5, cc: clang, cxx: clang++, qt_pkg: qtbase5-dev,  qt_flag: -DUSE_QT5=ON }
          # Qt6 is the default when no USE_QT* flag is given, and is also published.
          - { qt: Qt6, cc: gcc,   cxx: g++,     qt_pkg: qt6-base-dev, qt_flag: "" }

    steps:
      # submodules: recursive is not optional -- without it CMake fails at
      # add_subdirectory(capstone) before compiling anything.
      - name: Check out, including submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build ${{ matrix.qt_pkg }}

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=${{ matrix.cc }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
          -DPEBEAR_BUILD_TESTS=ON
          ${{ matrix.qt_flag }}

      - name: Build
        run: cmake --build build --parallel

      # --no-tests=ignore keeps this step honest while the test suite is still
      # landing: it passes when no tests are configured and runs them once they
      # are, rather than silently reporting success either way.
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build --output-on-failure --no-tests=ignore
