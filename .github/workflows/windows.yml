# Build and test PE-bear on Windows with MSVC.
#
# Replaces the MSBuild starter workflow that was here, which ran
# `nuget restore .` and `msbuild .`. There is no .sln or .vcxproj in this
# repository -- the Visual Studio project files are generated by CMake -- so
# MSBuild had nothing to open and the job could only fail.
name: Windows

on:
  push:
    branches: [ "main" ]
  pull_request:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned deliberately: an unpinned Qt would change the ABI of the produced
  # binaries without any commit to this repository.
  QT_VERSION: 6.8.1
  QT_ARCH: win64_msvc2022_64

jobs:
  build:
    name: Qt6 / MSVC x64
    runs-on: windows-2022

    steps:
      # Without submodules CMake stops at add_subdirectory(capstone).
      - name: Check out, including submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Qt is not present on the Windows runners and, unlike Linux and macOS,
      # there is no first-party package manager to get it from. aqtinstall is a
      # plain pip package, so it can be version-pinned here rather than taking
      # a third-party Action into the build of a tool used on untrusted files.
      - name: Install Qt
        run: |
          python -m pip install --disable-pip-version-check "aqtinstall==3.1.*"
          python -m aqt install-qt windows desktop ${env:QT_VERSION} ${env:QT_ARCH} -O ${{ github.workspace }}\Qt

      # vcpkg is preinstalled on the Windows runners (VCPKG_INSTALLATION_ROOT),
      # so libarchive costs a build rather than a new tool. It pulls zlib,
      # bzip2 and liblzma itself, which is why no separate steps appear here.
      - name: Install libarchive
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install libarchive:x64-windows
          if ($LASTEXITCODE -ne 0) { throw "vcpkg install failed" }

      - name: Configure
        run: >
          cmake -S . -B build -A x64
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x64-windows
          -DCMAKE_PREFIX_PATH="${{ github.workspace }}/Qt/${{ env.QT_VERSION }}/msvc2022_64"
          -DPEBEAR_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      # The test executables link against Qt, so its DLLs have to be findable
      # or they fail to start with no useful message.
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $env:PATH = "${{ github.workspace }}\Qt\${{ env.QT_VERSION }}\msvc2022_64\bin;$env:PATH"
          $env:PATH = "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\bin;$env:PATH"
          ctest --test-dir build -C Release --output-on-failure --no-tests=ignore

      - name: Check the executable was produced
        run: |
          if (-not (Test-Path "build/pe-bear/Release/PE-bear.exe")) {
            Write-Output "::error::PE-bear.exe was not produced by the build"
            Get-ChildItem -Recurse build/pe-bear -Filter *.exe
            exit 1
          }
          Write-Output "PE-bear.exe present"
